name: Build native release artifacts
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Git revision to build and verify
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: native-build-${{ inputs.revision }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-22.04
            platform: linux-x64-glibc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v6
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build nasm pkg-config patchelf
      - name: macOS build prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config nasm
      - run: python -m pip install meson==1.10.0
      - name: Build native codecs
        run: python native/build.py --platform '${{ matrix.platform }}' --jobs 3
      - name: Verify Java and codecs
        run: ./gradlew build
      - name: Verify minimal classpath and JPMS runtime
        run: python tools/runtime-smoke.py --platform '${{ matrix.platform }}'
      - name: Clean glibc compatibility and production-generation containers
        if: runner.os == 'Linux'
        run: |
          docker build --build-arg RUNTIME_IMAGE=ubuntu:22.04 -f native/Dockerfile.glibc-smoke .
          docker build --build-arg RUNTIME_IMAGE=ubuntu:26.04 -f native/Dockerfile.glibc-smoke .
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: native/dist/${{ matrix.platform }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.platform }}
          path: tests/build/reports/tests
  musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
      - name: Build and test musl codecs with JDK 26
        run: |
          docker build -f native/Dockerfile.musl --target tested -t glimt-musl-test .
          docker build -f native/Dockerfile.musl --target clean-runtime .
          container=$(docker create glimt-musl-test)
          mkdir -p native/dist
          docker cp "$container:/work/native/dist/linux-x64-musl" native/dist/
          docker rm "$container"
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-x64-musl
          path: native/dist/linux-x64-musl
          if-no-files-found: error
