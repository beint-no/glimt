name: Verify release bundles
on:
  workflow_call:
    inputs:
      native_run:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      native_run:
        description: Successful Verify workflow run supplying native artifacts
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-24.04
            platform: linux-x64-glibc
          - runner: ubuntu-24.04
            platform: linux-x64-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        if: matrix.platform != 'linux-x64-musl'
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v6
        if: matrix.platform != 'linux-x64-musl'
      - name: Verify glibc detection with a second libc installed
        if: matrix.platform == 'linux-x64-glibc'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl
          test -e /lib/ld-musl-x86_64.so.1
      - name: Download tested bundles and verify unchanged native inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NATIVE_RUN: ${{ inputs.native_run }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          gh run download "$NATIVE_RUN" --name "native-$PLATFORM" --dir "native/dist/$PLATFORM"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path('native/dist') / os.environ['PLATFORM']
          revisions = {json.loads(p.read_text())['commit'] for p in root.glob('*/build-info.json')}
          source = subprocess.check_output(['gh', 'run', 'view', os.environ['NATIVE_RUN'], '--json', 'headSha', '--jq', '.headSha'], text=True).strip()
          if revisions == {'source-distribution'} and os.environ['PLATFORM'] == 'linux-x64-musl':
              tested_revision = source
          else:
              assert len(revisions) == 1
              tested_revision = revisions.pop()
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', tested_revision], check=True,
                         stdout=subprocess.DEVNULL)
          if tested_revision != source:
              parents = subprocess.check_output(
                  ['git', 'show', '-s', '--format=%P', tested_revision], text=True).split()
              assert len(parents) == 2 and parents[1] == source
          subprocess.run(['git', 'diff', '--exit-code', tested_revision, '--', 'native'], check=True)
          PY
      - name: Test current Java code against release binaries
        if: matrix.platform != 'linux-x64-musl'
        run: |
          ./gradlew build -Pglimt.platform='${{ matrix.platform }}'
          python3 tools/runtime-smoke.py --platform '${{ matrix.platform }}'
      - name: Test supported glibc runtime range
        if: matrix.platform == 'linux-x64-glibc'
        run: |
          docker build --build-arg RUNTIME_IMAGE=ubuntu:22.04 -f native/Dockerfile.glibc-smoke .
          docker build --build-arg RUNTIME_IMAGE=ubuntu:26.04 -f native/Dockerfile.glibc-smoke .
      - name: Test musl Java code and clean runtime
        if: matrix.platform == 'linux-x64-musl'
        run: docker build -f tools/Dockerfile.bundles-musl .
      - uses: actions/upload-artifact@v7
        if: always() && matrix.platform != 'linux-x64-musl'
        with:
          name: final-test-results-${{ matrix.platform }}
          path: tests/build/reports/tests
