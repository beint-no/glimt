name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-22.04
            platform: linux-x64-glibc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v5
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build nasm pkg-config patchelf
      - name: macOS build prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config nasm
      - run: python -m pip install meson==1.10.0
      - name: Build native codecs
        run: python native/build.py --platform '${{ matrix.platform }}' --jobs 3
      - name: Verify Java and codecs
        run: ./gradlew build
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          path: native/dist/${{ matrix.platform }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.platform }}
          path: tests/build/reports/tests
  musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build and test musl codecs with JDK 26
        run: |
          docker build -f native/Dockerfile.musl --target tested -t glimt-musl-test .
          container=$(docker create glimt-musl-test)
          mkdir -p native/dist
          docker cp "$container:/work/native/dist/linux-x64-musl" native/dist/
          docker rm "$container"
      - uses: actions/upload-artifact@v6
        with:
          name: native-linux-x64-musl
          path: native/dist/linux-x64-musl
          if-no-files-found: error
