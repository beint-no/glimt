name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_run:
        description: Optional verified native run to reuse for Java-only changes
        required: false
        default: ''
        type: string
      sanitizer_cache:
        description: Optional exact same-toolchain cache key for a source-only patch rebuild
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bundles:
    if: inputs.native_run != ''
    uses: ./.github/workflows/verify-bundles.yml
    with:
      native_run: ${{ inputs.native_run }}
  native:
    if: inputs.native_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-22.04
            platform: linux-x64-glibc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v5
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build nasm pkg-config patchelf patch
      - name: macOS build prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config nasm
      - run: python -m pip install meson==1.10.0
      - name: Build native codecs
        run: python native/build.py --platform '${{ matrix.platform }}' --jobs 3
      - name: Verify Java and codecs
        run: ./gradlew build
      - name: Verify minimal classpath and JPMS runtime
        run: python tools/runtime-smoke.py --platform '${{ matrix.platform }}'
      - name: Clean glibc container
        if: runner.os == 'Linux'
        run: docker build -f native/Dockerfile.glibc-smoke .
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          path: native/dist/${{ matrix.platform }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.platform }}
          path: tests/build/reports/tests
  musl:
    if: inputs.native_run == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build and test musl codecs with JDK 26
        run: |
          docker build -f native/Dockerfile.musl --target tested -t glimt-musl-test .
          docker build -f native/Dockerfile.musl --target clean-runtime .
          container=$(docker create glimt-musl-test)
          mkdir -p native/dist
          docker cp "$container:/work/native/dist/linux-x64-musl" native/dist/
          docker rm "$container"
      - uses: actions/upload-artifact@v6
        with:
          name: native-linux-x64-musl
          path: native/dist/linux-x64-musl
          if-no-files-found: error
  sanitizer:
    if: inputs.native_run == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build nasm pkg-config patchelf clang patch
      - run: python -m pip install meson==1.10.0
      - name: Restore instrumented dependency build cache
        id: sanitizer-cache
        uses: actions/cache/restore@v4
        with:
          path: native/.work
          key: sanitizer-ubuntu22-clang14-${{ hashFiles('native/sources.json', 'native/build.py') }}-${{ github.sha }}
          restore-keys: |
            sanitizer-ubuntu22-clang14-${{ hashFiles('native/sources.json', 'native/build.py') }}-
            ${{ inputs.sanitizer_cache }}
      - name: Preflight sanitizer toolchain
        env:
          CC: clang
          CXX: clang++
        run: python native/sanitize.py --build-only
      - name: Build instrumented codecs
        id: instrumented-codecs
        env:
          CC: clang
          CXX: clang++
        run: python native/build.py --sanitize --jobs 3
      - name: Run malformed corpus under ASan and UBSan
        env:
          CC: clang
          CXX: clang++
        run: python native/sanitize.py
      - name: Preserve instrumented build for diagnosis
        if: always() && steps.instrumented-codecs.outcome == 'success' && steps.sanitizer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/.work
          key: sanitizer-ubuntu22-clang14-${{ hashFiles('native/sources.json', 'native/build.py') }}-${{ github.sha }}
